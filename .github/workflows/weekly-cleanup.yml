name: Weekly TaskFlo Cleanup

on:
  schedule:
    - cron: '0 13 * * 1'   # every Monday 13:00 UTC (~6am PT)
  workflow_dispatch:         # allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Remove completed tasks from tasks.json
        run: |
          python3 - <<'PYEOF'
          import json, sys

          PATH = "tasks.json"

          with open(PATH) as f:
              tasks = json.load(f)

          if not isinstance(tasks, list):
              print(f"Unexpected tasks.json shape ({type(tasks).__name__}); aborting without changes.")
              sys.exit(1)


          def is_done(task):
              if not isinstance(task, dict):
                  return False
              status = str(task.get("status", "")).strip().lower()
              return status in ("completed", "done") or task.get("completed") is True


          def is_recurring(task):
              # Recurring tasks carry a recurrence value and must survive cleanup
              # even when the current instance is marked completed.
              return isinstance(task, dict) and bool(task.get("recurrence"))


          before = len(tasks)
          kept = [t for t in tasks if not is_done(t) or is_recurring(t)]
          removed = before - len(kept)

          if removed == 0:
              print("No completed tasks to remove.")
              sys.exit(0)

          # Safety guard: never let cleanup empty the file.
          if not kept:
              print("Refusing to write an empty tasks.json; aborting.")
              sys.exit(1)

          with open(PATH, "w") as f:
              json.dump(kept, f, indent=2)
              f.write("\n")

          print(f"Removed {removed} completed task(s): {before} -> {len(kept)}")
          PYEOF

      - name: Commit and push tasks.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tasks.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: weekly cleanup of completed tasks [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main
